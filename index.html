<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Tech Universe</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- Header -->
<header class="navbar">
    <div class="logo">
      <span class="logo-icon">❖</span> CATALOGO
    </div>
    <div class="search-bar-main">
      <input type="text" id="searchInput" placeholder="Buscar producto..." />
    </div>
    <div class="nav-links">
      <span>📦 Catálogo</span>
      <span>🛒 Carrito</span>
    </div>
</header>

<!-- Banner Animado de Productos (Carrusel continuo) -->
<section class="hero-banner">
    <div class="banner-track" id="bannerTrack">
      <!-- Generado dinámicamente o imágenes de productos destacados -->
    </div>
</section>

<!-- Contenido Principal -->
<div class="main-layout">
    
    <!-- Sidebar Categorías -->
    <aside class="sidebar">
      <h3>CATEGORÍAS</h3>
      <ul class="category-list">
        <li class="active" onclick="filterByCategory('Todos')">Todos</li>
        <li onclick="filterByCategory('Electrónica')">Electrónica</li>
        <li onclick="filterByCategory('Accesorios')">Accesorios</li>
        <li onclick="filterByCategory('Herramientas')">Herramientas</li>
      </ul>
    </aside>

    <!-- Sección de Productos -->
    <main class="products-container">
      <div class="toolbar">
        <div class="tabs">
          <button class="tab active">Catálogo Completo</button>
        </div>
      </div>

      <!-- Grid de Productos -->
      <div class="product-grid" id="productGrid">
        <!-- Generado dinámicamente desde script.js -->
      </div>
    </main>

</div>

<script src="script.js"></script>

</body>
</html>
